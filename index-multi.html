<!DOCTYPE html>
<html>

<head>
    <title>Itowns - Two independent 2.5D views</title>

    <script type="importmap">
        {
            "imports": {
                "itowns": "../dist/itowns.js",
                "debug": "../dist/debug.js",
                "dat": "https://unpkg.com/dat.gui@0.7.9/build/dat.gui.module.js",
                "GuiTools": "./jsm/GUI/GuiTools.js",
                "LoadingScreen": "./jsm/GUI/LoadingScreen.js",
                "itowns_widgets": "../dist/itowns_widgets.js",
                "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
            }
        }
        </script>

    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="css/example.css">
    <link rel="stylesheet" type="text/css" href="css/LoadingScreen.css">
    <link rel="stylesheet" type="text/css" href="css/widgets.css">

    <style>
        /* Simple side-by-side layout for the two viewers */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #container {
            display: flex;
            flex-direction: row;
            width: 100%;
            height: 100%;
        }

        .viewer {
            flex: 1 1 50%;
            position: relative;
        }

        #description {
            position: absolute;
            z-index: 10;
            left: 10px;
            top: 10px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            font-family: sans-serif;
            font-size: 12px;
        }
    </style>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div id="description">
        Two independent 2.5D planar views (same dataset).<br>
        Left and right maps can be controlled separately.
        <ul>
            <li>Left-click: translate</li>
            <li>Right-click: translate (pan)</li>
            <li>Ctrl + Left-click: orbit (tilt)</li>
            <li>Mouse wheel: zoom</li>
            <li>Space / Middle-click: smart travel</li>
        </ul>
    </div>

    <div id="container">
        <div id="viewerDivLeft" class="viewer"></div>
        <div id="viewerDivRight" class="viewer"></div>
    </div>

    <script type="module">
        import GuiTools from 'GuiTools';
        import setupLoadingScreen from 'LoadingScreen';
        import * as THREE from 'three';
        import * as itowns from 'itowns';
        import * as debug from 'debug';
        import * as itowns_widgets from 'itowns_widgets';

        // Define EPSG:3946 like in the original 2.5D example
        // (taken from https://epsg.io/3946, Proj4js section)
        itowns.CRS.defs(
            'EPSG:3946',
            '+proj=lcc +lat_1=45.25 +lat_2=46.75 +lat_0=46 ' +
            '+lon_0=3 +x_0=1700000 +y_0=5200000 +ellps=GRS80 ' +
            '+towgs84=0,0,0,0,0,0,0 +units=m +no_defs'
        );

        // Base extent from view_25d_map.html (Lyon area)
        const baseExtent = new itowns.Extent(
            'EPSG:3946',
            1837816.94334, 1847692.32501,
            5170036.4587, 5178412.82698
        );

        const viewerDivLeft = document.getElementById('viewerDivLeft');
        const viewerDivRight = document.getElementById('viewerDivRight');

        // Helper factory to build one 2.5D planar view with color + elevation + scale
        function create25DView(viewerDiv, extent, placementOptions) {
            const view = new itowns.PlanarView(viewerDiv, extent, {
                placement: placementOptions,
            });

            setupLoadingScreen(viewerDiv, view);

            // WMS imagery source (orthophoto)
            const wmsImagerySource = new itowns.WMSSource({
                extent: extent,
                name: 'ortho_latest',
                url: 'https://imagerie.data.grandlyon.com/wms/grandlyon',
                version: '1.3.0',
                crs: 'EPSG:3946',
                format: 'image/jpeg',
            });

            const wmsImageryLayer = new itowns.ColorLayer('wms_imagery_' + viewerDiv.id, {
                updateStrategy: {
                    type: itowns.STRATEGY_DICHOTOMY,
                    options: {},
                },
                source: wmsImagerySource,
            });

            view.addLayer(wmsImageryLayer);

            // WMS elevation source
            const wmsElevationSource = new itowns.WMSSource({
                extent: extent,
                url: 'https://imagerie.data.grandlyon.com/wms/grandlyon',
                name: 'MNT2018_Altitude_2m',
                crs: 'EPSG:3946',
                width: 256,
                format: 'image/jpeg',
            });

            const wmsElevationLayer = new itowns.ElevationLayer('wms_elevation_' + viewerDiv.id, {
                useColorTextureElevation: true,
                colorTextureElevationMinZ: 144,
                colorTextureElevationMaxZ: 622,
                source: wmsElevationSource,
            });

            view.addLayer(wmsElevationLayer);

            // Optional: label layer (same as in view_25d_map.html)
            const wfsCartoSource = new itowns.WFSSource({
                url: 'https://data.geopf.fr/wfs/ows?',
                version: '2.0.0',
                typeName: 'BDCARTO_V5:zone_d_habitation',
                crs: 'EPSG:3946',
                ipr: 'IGN',
                format: 'application/json',
            });

            const wfsCartoStyle = {
                zoom: { min: 0, max: 20 },
                text: {
                    field: '{toponyme}',
                    color: 'white',
                    transform: 'uppercase',
                    size: 15,
                    haloColor: 'rgba(20,20,20, 0.8)',
                    haloWidth: 3,
                },
            };

            const wfsCartoLayer = new itowns.LabelLayer('wfsCarto_' + viewerDiv.id, {
                source: wfsCartoSource,
                style: wfsCartoStyle,
            });

            view.addLayer(wfsCartoLayer);

            // Scale widget in the bottom-right of each viewer
            const scale = new itowns_widgets.Scale(view, {
                position: 'bottom-right',
                translate: { x: -70 },
            });

            // Trigger initial render
            view.notifyChange();

            return view;
        }

        // Left view: same placement as the original 2.5D example
        const viewLeft = create25DView(
            viewerDivLeft,
            baseExtent,
            { heading: 49.6, range: 6200, tilt: 17 }
        );

        // Right view: slightly different camera settings
        // (you can adapt heading/range/tilt or extent for origin/destination)
        const viewRight = create25DView(
            viewerDivRight,
            baseExtent,
            { heading: -20.0, range: 8000, tilt: 45 }
        );

        // Optional: if you want *different* geographic regions,
        // create another Extent for the second view and pass it instead of baseExtent.

        // Expose for debugging in the console
        window.viewLeft = viewLeft;
        window.viewRight = viewRight;
        window.itowns = itowns;
        window.THREE = THREE;
    </script>
</body>

</html>
